<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100c18">
  <meta name="description" content="Un pequeño jardín de lirios, hecho con mucho amor para Elena.">
  <title>Para Elena, con amor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main class="scene">
    <div class="eyebrow"><span class="sparkle">✦</span> PARA MI PERSONA FAVORITA <span class="sparkle">✦</span></div>
    <section class="card" aria-label="Dedicatoria para Elena">
      <div class="flower-garden" aria-hidden="true">
        <svg class="lily lily-left" viewBox="0 0 180 230"><path class="stem" d="M90 220Q88 150 96 92"/><path class="leaf" d="M89 170Q35 135 29 157Q49 184 89 178M92 190q48-42 61-17-17 27-61 26"/><g class="bloom"><path d="M95 103Q45 94 70 45Q95 62 98 96Q97 44 128 35Q137 73 101 101Q137 63 158 91Q141 119 102 107Q143 116 132 148Q102 145 96 108Q91 146 61 144Q54 111 95 103Z"/><circle cx="98" cy="105" r="5"/></g></svg>
        <svg class="lily lily-center" viewBox="0 0 180 230"><path class="stem" d="M90 220Q91 145 87 77"/><path class="leaf" d="M90 180Q35 146 26 168Q47 194 89 188M91 199q46-39 59-15-15 26-59 24"/><g class="bloom"><path d="M88 91Q37 80 63 31Q90 50 91 85Q91 34 124 24Q132 65 94 90Q132 51 153 78Q136 107 96 96Q137 105 125 137Q95 134 89 98Q85 135 53 132Q48 99 88 91Z"/><circle cx="91" cy="94" r="5"/></g></svg>
        <svg class="lily lily-right" viewBox="0 0 180 230"><path class="stem" d="M90 220Q95 152 83 102"/><path class="leaf" d="M93 177Q140 143 151 165Q136 193 93 185M91 199q-47-37-60-12 15 25 59 21"/><g class="bloom"><path d="M82 111Q31 102 57 53Q84 70 85 105Q85 54 117 45Q127 85 89 110Q127 71 148 98Q131 127 91 115Q131 125 120 156Q90 153 83 117Q79 154 47 151Q42 118 82 111Z"/><circle cx="85" cy="113" r="5"/></g></svg>
      </div>
      <p class="prelude">Elena,</p>
      <h1>Un ramo de lirios<br><em>para ti</em></h1>
      <div class="divider"><span></span>❀<span></span></div>
      <p class="message">Porque hasta el día más sencillo<br>se vuelve bonito cuando estás en él.</p>
      <p class="signoff">Con todo mi amor <span>♥</span></p>
      <button id="surprise" type="button">Toca aquí, mi amor <span aria-hidden="true">✧</span></button>
      <p id="surprise-message" class="surprise-message" aria-live="polite" hidden>Te elegiría a ti, en esta vida y en todas las flores del mundo. <span>♥</span></p>
    </section>
    <p class="hint">Un pequeño jardín hecho pensando en ti</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
